name: Weekly Model Retraining

on:
  # Schedule: Run every Sunday at 2 AM IST (8:30 PM Saturday UTC)
  schedule:
    - cron: '30 20 * * 6'  # 8:30 PM Saturday UTC = 2:00 AM Sunday IST

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write  # Allow workflow to push changes

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert-${{ hashFiles('**/analyze_news_finbert_all.py') }}
          restore-keys: |
            huggingface-finbert-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub

      - name: Collect stock data
        run: |
          echo "Collecting latest stock data..."
          python collect_stock_data.py

      - name: Calculate technical indicators
        run: |
          echo "Calculating technical indicators..."
          python calculate_technical_indicators.py

      - name: Collect Nifty Bank index
        run: |
          echo "Collecting Nifty Bank index data..."
          python collect_nifty_index.py

      - name: Collect USD/INR exchange rate
        run: |
          echo "Collecting USD/INR forex data..."
          python collect_usd_inr_rate.py

      - name: Collect news data
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          echo "Collecting latest news for sentiment analysis..."
          python collect_news_all_stocks.py

      - name: Analyze news with FinBERT
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Analyzing news sentiment with FinBERT..."
          python analyze_news_finbert_all.py

      - name: Extract advanced market signals
        run: |
          echo "Extracting advanced trading signals from news..."
          python analyze_news_advanced_signals.py

      - name: Prepare advanced features
        run: |
          echo "Preparing features with advanced signals (196 features)..."
          python prepare_advanced_features.py

      - name: Retrain V5 Advanced models
        run: |
          echo "Retraining V5 Advanced models (this may take several hours)..."
          # Set environment to use CPU only
          export CUDA_VISIBLE_DEVICES=""
          export TF_CPP_MIN_LOG_LEVEL=2

          # Train all V5 Advanced models (196 features, USD/INR 15x weight)
          python train_all_v5_advanced.py

      - name: Upload models to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_WRITE }}
        run: |
          echo "Uploading retrained models to Hugging Face..."
          python upload_advanced_models_to_hf.py

      - name: Generate fresh predictions
        run: |
          echo "Generating predictions with retrained models..."
          python generate_daily_predictions_advanced.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add model updates (if not too large)
          git add data/ || true
          git add future_predictions_next_day.json future_predictions_next_day.csv
          git add web/future_predictions_next_day.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly model retraining - $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

      - name: Create summary report
        run: |
          echo "# Weekly Retraining Report" > retrain_report.md
          echo "**Date**: $(date)" >> retrain_report.md
          echo "**Status**: Completed" >> retrain_report.md
          echo "" >> retrain_report.md
          cat prediction_metadata.json >> retrain_report.md || true
